<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>產生圖示</title>
<style>body { margin: 0; background: #888; } canvas { display: block; }</style></head>
<body>
<!-- 由 tools/render-sprites.mjs 開啟：把 3D 地標畫成小圖（img/zone/*.webp）和 App 圖示（icons/*.png），
     一張一張送回 render-sprites.mjs 存檔。直接用瀏覽器開這一頁只會看到畫面，不會存檔。 -->
<script type="module">
import { THREE, Kit } from '../js/3d/kit.js';
import { buildLandmark, LANDMARK_KEYS, C } from '../js/3d/landmarks.js';
import { buildHero } from '../js/3d/hero.js';

const TOP = { mine: '#b5a58e', mill: '#e9c75a', oasis: '#f0dca4', arena: '#ddc68d', palace: '#83d46c', garden: '#73cb62', mountain: '#a3b08f', maze: '#6db35b', castle: '#95d05a' };
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

function lights(scene) {
  scene.add(new THREE.HemisphereLight('#eaf5ff', '#8f7d5c', 1.3), new THREE.AmbientLight('#ffffff', 0.35));
  const sun = new THREE.DirectionalLight('#fff3dc', 1.9);
  sun.position.set(-20, 40, 22);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 120 });
  sun.shadow.bias = -0.0005;
  scene.add(sun);
}

// 地標放在一塊圓形草地上（像桌遊的棋子）
function token(key, opts = {}) {
  const g = new THREE.Group();
  const lm = buildLandmark(key);
  if (lm.setState) lm.setState({ open: true });
  lm.update(opts.t || 1.3, 0);
  const r = key === 'castle' ? 8.6 : key === 'palace' ? 6.9 : key === 'mountain' ? 6.6 : 6.4;
  const k = new Kit();
  k.cyl(r, r * 0.97, 0.9, 28, '#a87a4c', { p: [0, -1.4, 0] });
  k.cyl(r + 0.05, r, 0.55, 28, TOP[key] || '#95d05a', { p: [0, -0.55, 0] });
  const base = k.build();
  base.traverse((o) => { if (o.isMesh) o.receiveShadow = true; });
  g.add(base);
  g.add(lm.group);
  return { g, lm };
}

// 鏡頭拉到剛好把看得到的模型（取樣頂點）裝進畫面，並且置中；fill > 1 會多留邊
function frame(obj, cam, yaw, pitch, fill = 1) {
  obj.updateMatrixWorld(true);
  const pts = [];
  obj.traverse((o) => {
    if (!o.isMesh) return;
    for (let v = o; v; v = v.parent) if (!v.visible) return;
    const a = o.geometry.attributes.position, step = Math.max(1, Math.floor(a.count / 1500));
    for (let i = 0; i < a.count; i += step) pts.push(new THREE.Vector3().fromBufferAttribute(a, i).applyMatrix4(o.matrixWorld));
  });
  const target = new THREE.Box3().setFromPoints(pts).getCenter(new THREE.Vector3());
  const place = (d) => {
    cam.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * d, target.y + Math.sin(pitch) * d, target.z + Math.cos(yaw) * Math.cos(pitch) * d);
    cam.lookAt(target); cam.near = d / 20; cam.far = d * 4; cam.updateProjectionMatrix(); cam.updateMatrixWorld();
  };
  const v = new THREE.Vector3();
  const fitD = () => {
    let lo = 1, hi = 400;
    for (let i = 0; i < 28; i++) {
      const d = (lo + hi) / 2;
      place(d);
      const ok = pts.every((p) => { v.copy(p).project(cam); return Math.abs(v.x) < 0.95 && Math.abs(v.y) < 0.95; });
      if (ok) hi = d; else lo = d;
    }
    return hi;
  };
  let d = fitD();
  for (let k = 0; k < 3; k++) {
    place(d);
    let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
    for (const p of pts) { v.copy(p).project(cam); x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); }
    const hh = d * Math.tan(THREE.MathUtils.degToRad(cam.fov) / 2), hw = hh * cam.aspect;
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0), up = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
    target.addScaledVector(right, ((x0 + x1) / 2) * hw).addScaledVector(up, ((y0 + y1) / 2) * hh);
    d = fitD();
  }
  place(d * fill);
}

async function send(name, canvas, type, q) {
  const data = canvas.toDataURL(type, q);
  const r = await fetch('/save', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name, data }) });
  if (!r.ok) throw new Error('存檔失敗 ' + name);
}
function shot(scene, cam, w, h) {
  renderer.setSize(w, h, false);
  renderer.render(scene, cam);
  return renderer.domElement;
}
function sky() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 256;
  const g = c.getContext('2d'), grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, '#4fa6f2'); grd.addColorStop(0.6, '#9fd5ff'); grd.addColorStop(1, '#e6f4ff');
  g.fillStyle = grd; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// 縮小時先畫大張再縮，邊緣比較乾淨
function downscale(src, w) {
  const c = document.createElement('canvas');
  c.width = c.height = w;
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(src, 0, 0, w, w);
  return c;
}

const log = [];
try {
  // 1. 每個地方的小圖（透明背景）
  for (const key of [...LANDMARK_KEYS, 'generic']) {
    const scene = new THREE.Scene();
    lights(scene);
    const { g } = token(key);
    scene.add(g);
    const cam = new THREE.PerspectiveCamera(26, 1, 1, 500);
    frame(g, cam, 0.42, 0.52, 1.04);
    await send(`img/zone/${key}.webp`, shot(scene, cam, 360, 360), 'image/webp', 0.9);
    log.push(key);
  }
  // 2. 小勇者（首頁、結算畫面用）
  {
    const scene = new THREE.Scene();
    lights(scene);
    const h = buildHero();
    h.shadow.visible = false;
    h.group.rotation.y = 0.35;
    scene.add(h.group);
    const cam = new THREE.PerspectiveCamera(24, 1, 0.1, 100);
    frame(h.group, cam, 0.2, 0.18, 1.04);
    await send('img/hero.webp', shot(scene, cam, 360, 360), 'image/webp', 0.9);
  }
  // 3. App 圖示：天空底＋王城（iPad 主畫面、PWA）
  {
    const scene = new THREE.Scene();
    scene.background = sky();
    lights(scene);
    const { g } = token('castle');
    scene.add(g);
    const cam = new THREE.PerspectiveCamera(26, 1, 1, 500);
    frame(g, cam, 0.42, 0.42, 1.3);
    const big = shot(scene, cam, 1024, 1024);
    await send('icons/icon-512.png', downscale(big, 512), 'image/png');
    await send('icons/icon-192.png', downscale(big, 192), 'image/png');
    await send('icons/apple-touch-icon.png', downscale(big, 180), 'image/png');
    frame(g, cam, 0.42, 0.42, 1.05);
    const small = shot(scene, cam, 256, 256);
    await send('icons/icon-32.png', downscale(small, 32), 'image/png');
  }
  await fetch('/done', { method: 'POST', body: JSON.stringify({ ok: true, log }) });
} catch (e) {
  await fetch('/done', { method: 'POST', body: JSON.stringify({ ok: false, error: String(e && e.stack || e) }) });
}
</script>
</body></html>
